name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Permisos necesarios
permissions:
  contents: read
  pages: write
  id-token: write

# Evitar deploys simultáneos
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Inject API URL
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          echo "Inyectando API URL..."
          sed -i "s|{{API_URL}}|$API_URL|g" js/app.js
          echo "Verificando reemplazo:"
          grep -o "API_URL:.*" js/app.js | head -1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
